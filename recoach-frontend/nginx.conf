server {
    listen 4173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 不在 Server 头暴露具体版本号
    server_tokens off;

    # ---- 安全响应头 ----
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # script-src 不需要 'unsafe-inline'：index.html 无内联脚本，Vite 产物全部是外部文件。
    # style-src 必须保留 'unsafe-inline'，KaTeX 会注入内联样式。
    # 如果前端后续引入内联脚本或 CDN 资源，需要同步放宽这里。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";

        # 关键：剥掉客户端自带的身份头，阻断"自行声明 x-user-id 冒充他人"。
        # 身份只能由后端在鉴权通过后决定（见 app/auth.py）。
        proxy_set_header x-user-id "";

        # 保留客户端 x-request-id 以便全链路追踪（后端会做字符白名单净化）。
        proxy_set_header x-request-id $http_x_request_id;
        # Authorization 供令牌模式使用，nginx 默认透传，这里显式声明避免被上游中间件覆盖。
        proxy_set_header Authorization $http_authorization;

        # SSE：关闭缓冲，否则事件会被攒起来一次性下发
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 带 hash 的静态产物可长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
